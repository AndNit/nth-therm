baseURL = "https://nth-therm.com/"
title = "NTH Therm – Industrieöfen nach Maß | Made in Germany"
defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableGitInfo = false
summaryLength = 70
paginate = 10

[build]
  writeStats = true

[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false

[markup]
