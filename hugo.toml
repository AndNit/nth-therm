defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false
# robots.txt is served as a curated static file (static/robots.txt) so we can
# add the Sitemap directive + AI-crawler rules that Hugo's generator omits.
enableRobotsTXT = false
enableGitInfo = false
summaryLength = 70
paginate = 10

[build]
