  phone = "+49 7272 9310989"
  mobile = "+49 1523 3626998"
  email = "info@nth-therm.com"
  address = "Lerchenweg 11, 76761 Rülzheim"
  companyName = "NTH Therm GmbH"
  hrb = "HRB 32913, Amtsgericht Landau (Pfalz)"
  vatId = "DE335186159"
  taxNumber = "41/650/20464"
  googleMapsEmbed = "https://maps.google.com/?q=Lerchenweg+11+76761+Rulzheim"
  formspreeEndpoint = "https://formspree.io/f/YOUR_FORM_ID"
  enableSchema = true
  enableHreflang = true
  cookieBannerEnabled = true

